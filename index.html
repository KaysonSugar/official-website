<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport：按设备宽度渲染、初始不缩放，响应式适配的前提 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 空白期底色用 brand-50，scrollbar-gutter 预留滚动条槽，避免内容变长时整页挤窄 -->
    <style>
      html {
        background-color: #fff7f2;
        scrollbar-gutter: stable;
      }
    </style>

    <!-- 关掉自动滚动恢复，必须写在 head 同步脚本里，等 main.ts 执行时浏览器已经恢复过了 -->
    <script>
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual'
    </script>

    <!-- 标题：搜索结果里的蓝色大标题，30 字以内 -->
    <title>威易达化工 - 企业级解决方案与服务</title>

    <!-- 描述：搜索结果摘要，80~120 字，自然带业务关键词 -->
    <meta
      name="description"
      content="威易达化工官方网站，提供化工行业数字化平台架构、产品矩阵与解决方案介绍，帮助企业提升生产效率、降低运营成本。"
    />
    <!-- 关键词：现代搜索引擎权重很低，保留给部分老式搜索引擎 -->
    <meta name="keywords" content="威易达化工,WEIYIDA,化工,数字化平台,解决方案,产品矩阵" />
    <meta name="author" content="威易达化工" />

    <!-- canonical：声明唯一地址避免重复收录，上线时换成正式域名 -->
    <link rel="canonical" href="https://example.com/" />

    <!-- Open Graph：微信、飞书、LinkedIn 等平台分享时的卡片信息 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="威易达化工" />
    <meta property="og:title" content="威易达化工 - 企业级解决方案与服务" />
    <meta
      property="og:description"
      content="威易达化工官方网站，提供化工行业数字化平台架构、产品矩阵与解决方案介绍。"
    />
    <meta property="og:url" content="https://example.com/" />
    <!-- 分享封面：必须绝对地址，建议 1200×630 -->
    <meta property="og:image" content="https://example.com/og-cover.png" />

    <!-- Twitter / X 大图卡片 -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="威易达化工 - 企业级解决方案与服务" />
    <meta
      name="twitter:description"
      content="威易达化工官方网站，提供化工行业数字化平台架构、产品矩阵与解决方案介绍。"
    />
    <meta name="twitter:image" content="https://example.com/og-cover.png" />

    <!-- 手机浏览器地址栏配色，与品牌主色 brand-500 (#FF833F) 一致 -->
    <meta name="theme-color" content="#FF833F" />

    <!-- 站点图标，由品牌 logo 导出，放在 public/ 下 -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- iOS 添加到主屏的图标，建议 180×180 -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- 预加载顶栏 logo，构建时 Vite 会把路径重写成带 hash 的产物 -->
    <link rel="preload" as="image" href="/src/assets/brand/logo.webp" />

    <!-- 预加载 Inter 拉丁子集，as="font" 必须配 crossorigin，否则等于白下两遍 -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/inter-latin-wght-normal.woff2"
      crossorigin
    />
  </head>
  <body>
    <!-- 禁用 JS 时的兜底提示，不然访客只看到一片空白 -->
    <noscript>
      <div
        style="
          margin: 0;
          padding: 24px 16px;
          font-family: system-ui, sans-serif;
          font-size: 15px;
          line-height: 1.7;
          color: #1a1a1a;
          background: #fff7f2;
          border-bottom: 1px solid #ffe9dc;
        "
      >
        本站需要启用 JavaScript 才能正常浏览，请开启后刷新页面。
      </div>
    </noscript>

    <!-- Vue 挂载点，对应 main.ts 的 mount('#app') -->
    <div id="app"></div>
    <!-- 入口脚本，开发时由 Vite 实时编译 -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
